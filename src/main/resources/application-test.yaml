server:
  port: 10362
  forward-headers-strategy: framework
spring:
  application:
    name: account
  datasource:
    url: jdbc:h2:file:./data/accountDB;
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      password:
      timeout: 2000
  cloud:
    config:
      enabled: false
rabbitmq:
  point:
    exchange: sajotuna.point.exchange
    routing-key: sajotuna.point.earn
eureka:
  client:
    service-url:
      defaultZone: http://localhost:10372/eureka/
  instance:
    prefer-ip-address: true

token:
  secret: testestestestestestestestestestestes

logging:
  level:
    com.netflix.discovery: off
    com.netflix.eureka: off
    org.springframework.cloud.netflix.eureka: off

management:
  endpoints:
    web:
      exposure:
        include: health,info

cookie:
  domain: ""
  secure: false